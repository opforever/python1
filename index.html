<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Code Playground</title>
    <meta name="description" content="A serene, beginner-friendly Python playground with real-time execution, interactive terminal, and standard library support." />
    <meta property="og:title" content="Python Code Playground" />
    <meta property="og:description" content="A serene, beginner-friendly Python playground with real-time execution, interactive terminal, and standard library support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js" defer></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f14;
        color: #e2e8f0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      @keyframes sanctuary-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0b0f14] text-[#e2e8f0] antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #0b0f14; color: #94a3b8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; flex-direction: column; gap: 14px; user-select: none;">
        <div style="width: 32px; height: 32px; border: 2.5px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: sanctuary-spin 0.9s linear infinite;"></div>
        <span style="color: #cbd5e1; font-weight: 500; letter-spacing: 0.02em;">Preparing Python Sanctuary...</span>
        <span style="color: #64748b; font-size: 12px;">Loading WebAssembly runtime</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
